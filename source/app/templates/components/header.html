<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/85 backdrop-blur-xl transition-colors dark:border-white/10 dark:bg-brand-dark/85">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-2 px-2 sm:px-6 lg:px-8">

        <!-- Логотип -->
        <a href="{{ canonical_url or site_url or '/' }}"
           @click="if(window.trackEvent) window.trackEvent('header_brand_click', { target: 'goida_vpn_site' })"
           data-no-confirm
           aria-label="Goida VPN Configs"
           class="group flex min-w-0 cursor-pointer items-center gap-2.5 rounded-xl px-1 py-1 sm:gap-3">
            <span class="relative flex h-8 w-8 items-center justify-center transition-transform duration-300 group-hover:scale-105 group-hover:rotate-3 sm:h-10 sm:w-10">
                <img src="static/images/favicon.png" alt="Логотип Goida VPN - Автоматические конфиги" class="h-6 w-6 object-contain sm:h-7 sm:w-7" data-i18n-alt="header.logo_alt">
            </span>
            <span class="hidden min-w-0 sm:block">
                <span class="block max-w-[11rem] truncate text-base font-black leading-none tracking-tight text-slate-900 dark:text-white sm:max-w-none sm:text-xl">
                    Goida VPN <span class="bg-gradient-to-r from-blue-600 to-brand-blue bg-clip-text text-transparent dark:from-blue-400 dark:to-sky-300">Configs</span>
                </span>
                <span class="mt-1 hidden items-center gap-1.5 text-[11px] font-semibold text-slate-500 dark:text-slate-400 sm:flex">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
                    <span data-i18n="header.tagline">Бесплатно · Обновление каждые 9 мин</span>
                </span>
            </span>
        </a>

        <!-- Правая часть -->
        <div class="flex min-w-0 items-center gap-1 sm:gap-2.5">

            <!-- Соцсети: все 4 иконки всегда видны; на мобильных — компактная пилюля -->
            <nav aria-label="Social links" class="flex shrink-0 items-center gap-0 rounded-xl border border-slate-200/80 bg-slate-50/60 p-0.5 dark:border-white/10 dark:bg-white/5 sm:gap-1 sm:p-1">
                <a href="https://www.youtube.com/@avencores/" target="_blank"
                   rel="noopener noreferrer"
                   aria-label="YouTube"
                   title="YouTube"
                   @click="if(window.trackEvent) window.trackEvent('social_click', { platform: 'youtube', location: 'header' })"
                   class="flex h-7 w-7 items-center justify-center rounded-lg text-red-600 transition-all duration-200 hover:bg-red-50 hover:scale-105 active:scale-95 dark:hover:bg-red-500/10 sm:h-8 sm:w-8">
                    <i class="fa-brands fa-youtube text-base sm:text-lg"></i>
                </a>
                <a href="https://t.me/avencoresyt" target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Telegram"
                   title="Telegram"
                   @click="if(window.trackEvent) window.trackEvent('social_click', { platform: 'telegram', location: 'header' })"
                   class="flex h-7 w-7 items-center justify-center rounded-lg text-sky-600 transition-all duration-200 hover:bg-sky-50 hover:scale-105 active:scale-95 dark:text-sky-400 dark:hover:bg-sky-500/10 sm:h-8 sm:w-8">
                    <i class="fa-brands fa-telegram text-base sm:text-lg"></i>
                </a>
                <a href="https://vk.ru/avencoresreuploads" target="_blank"
                   rel="noopener noreferrer"
                   aria-label="VK"
                   title="VK"
                   @click="if(window.trackEvent) window.trackEvent('social_click', { platform: 'vk', location: 'header' })"
                   class="flex h-7 w-7 items-center justify-center rounded-lg text-blue-700 transition-all duration-200 hover:bg-blue-50 hover:scale-105 active:scale-95 dark:text-blue-400 dark:hover:bg-blue-500/10 sm:h-8 sm:w-8">
                    <i class="fa-brands fa-vk text-base sm:text-lg"></i>
                </a>
                <a href="https://www.dzen.ru/avencores" target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Dzen"
                   title="Dzen"
                   @click="if(window.trackEvent) window.trackEvent('social_click', { platform: 'dzen', location: 'header' })"
                   class="flex h-7 w-7 items-center justify-center rounded-lg transition-all duration-200 hover:bg-slate-100 hover:scale-105 active:scale-95 dark:hover:bg-white/10 sm:h-8 sm:w-8">
                    <img :src="darkMode ? 'static/media/dz-w.png' : 'static/media/dz-b.png'" alt="DZ" class="h-4 w-4 object-contain sm:h-5 sm:w-5">
                </a>
            </nav>

            <!-- Кнопки управления -->
            <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">

                <!-- Переключатель языка -->
                <div class="relative" @click.outside="langOpen = false">
                    <button @click="langOpen = !langOpen"
                        class="group flex h-8 items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-2 transition-all duration-200 hover:border-blue-300 hover:shadow-sm active:scale-95 dark:border-white/10 dark:bg-white/5 dark:hover:border-blue-500/40 dark:hover:bg-white/10 sm:h-10 sm:px-3"
                        :class="langOpen ? 'border-blue-400 shadow-md shadow-blue-500/10 dark:border-blue-500/50' : ''"
                        aria-haspopup="listbox"
                        :aria-expanded="langOpen.toString()"
                        aria-label="Select language"
                        id="lang-toggle-button">
                        <i class="fa-solid fa-globe text-sm text-brand-blue transition-transform duration-300 group-hover:rotate-12 dark:text-blue-400"></i>
                        <span class="text-[11px] font-black uppercase tracking-wider text-brand-blue dark:text-blue-300 sm:text-xs"
                              x-text="(currentLanguage || 'ru').toUpperCase()"></span>
                        <i class="fa-solid fa-chevron-down hidden text-[9px] text-slate-400 transition-transform duration-200 dark:text-slate-500 sm:inline"
                           :class="langOpen ? 'rotate-180' : ''"></i>
                    </button>

                    <!-- Dropdown -->
                    <div x-show="langOpen"
                         x-transition:enter="transition ease-out duration-200"
                         x-transition:enter-start="opacity-0 -translate-y-2 scale-95"
                         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                         x-transition:leave="transition ease-in duration-150"
                         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                         x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
                         class="absolute right-0 top-full z-50 mt-2 max-h-[70vh] w-52 overflow-y-auto rounded-2xl border border-slate-200 bg-white p-1.5 shadow-2xl shadow-slate-900/10 ring-1 ring-black/5 dark:border-white/10 dark:bg-brand-panel dark:ring-white/10"
                         style="display: none;"
                         id="lang-dropdown"
                         role="listbox">
                        <button @click="setLangWithAnim('ru')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'ru' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/ru.png" srcset="static/images/flags/ru.png 1x, static/images/flags/ru@2x.png 2x" alt="RU" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>Русский</span>
                            </span>
                            <svg x-show="currentLanguage === 'ru'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button @click="setLangWithAnim('en')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'en' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/gb.png" srcset="static/images/flags/gb.png 1x, static/images/flags/gb@2x.png 2x" alt="GB" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>English</span>
                            </span>
                            <svg x-show="currentLanguage === 'en'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button @click="setLangWithAnim('de')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'de' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/de.png" srcset="static/images/flags/de.png 1x, static/images/flags/de@2x.png 2x" alt="DE" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>Deutsch</span>
                            </span>
                            <svg x-show="currentLanguage === 'de'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button @click="setLangWithAnim('uk')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'uk' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/ua.png" srcset="static/images/flags/ua.png 1x, static/images/flags/ua@2x.png 2x" alt="UA" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>Українська</span>
                            </span>
                            <svg x-show="currentLanguage === 'uk'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button @click="setLangWithAnim('be')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'be' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/by.png" srcset="static/images/flags/by.png 1x, static/images/flags/by@2x.png 2x" alt="BY" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>Беларуская</span>
                            </span>
                            <svg x-show="currentLanguage === 'be'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button @click="setLangWithAnim('kk')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'kk' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/kz.png" srcset="static/images/flags/kz.png 1x, static/images/flags/kz@2x.png 2x" alt="KZ" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>Қазақша</span>
                            </span>
                            <svg x-show="currentLanguage === 'kk'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button @click="setLangWithAnim('fr')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'fr' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/fr.png" srcset="static/images/flags/fr.png 1x, static/images/flags/fr@2x.png 2x" alt="FR" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>Français</span>
                            </span>
                            <svg x-show="currentLanguage === 'fr'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                        <button @click="setLangWithAnim('pl')"
                                class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-bold transition-colors hover:bg-slate-50 dark:hover:bg-white/5"
                                :class="currentLanguage === 'pl' ? 'bg-blue-50 text-brand-blue dark:bg-blue-500/15 dark:text-blue-300' : 'text-slate-700 dark:text-slate-300'">
                            <span class="flex items-center gap-2.5">
                                <img src="static/images/flags/pl.png" srcset="static/images/flags/pl.png 1x, static/images/flags/pl@2x.png 2x" alt="PL" class="h-3.5 w-5 rounded object-cover shadow-sm" loading="lazy">
                                <span>Polski</span>
                            </span>
                            <svg x-show="currentLanguage === 'pl'" class="h-4 w-4 text-brand-blue dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Тема -->
                <button @click="toggleTheme()"
                    class="group flex h-8 w-8 items-center justify-center rounded-xl border border-slate-200 bg-white transition-all duration-200 hover:border-slate-300 hover:shadow-sm active:scale-95 dark:border-white/10 dark:bg-white/5 dark:hover:border-white/20 dark:hover:bg-white/10 sm:h-10 sm:w-10"
                    :aria-label="darkMode ? 'Switch to light theme' : 'Switch to dark theme'"
                    :title="darkMode ? 'Светлая тема' : 'Тёмная тема'"
                    id="theme-button">
                    <i class="fa-solid fa-fw text-base transition-all duration-300 group-hover:rotate-12 group-hover:scale-110" :class="darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-blue-600 dark:text-slate-300'"></i>
                </button>

                <!-- Статистика -->
                <button @click="showStatsModal = true"
                    class="group flex h-8 items-center justify-center gap-2 rounded-xl border border-blue-700/20 bg-gradient-to-br from-blue-600 to-brand-blue px-2 text-sm font-bold text-white shadow-md shadow-blue-500/25 transition-all duration-200 hover:shadow-lg hover:shadow-blue-500/35 hover:-translate-y-px active:translate-y-0 active:scale-95 sm:h-10 sm:px-4"
                    aria-label="Open repository statistics"
                    id="stats-button">
                    <i class="fa-solid fa-chart-simple text-sm transition-transform group-hover:scale-110 sm:text-base"></i>
                    <span class="hidden stats-text lg:inline" x-text="t('header.stats', 'Статистика')">Статистика</span>
                </button>

                <!-- GitHub -->
                <a href="https://github.com/AvenCores/goida-vpn-configs" target="_blank"
                    rel="noopener noreferrer"
                    aria-label="GitHub repository"
                    title="GitHub"
                    @click="if(window.trackEvent) window.trackEvent('social_click', { platform: 'github', location: 'header' })"
                    class="group flex h-8 items-center justify-center gap-2 rounded-xl border border-white/10 bg-slate-900 px-2 text-sm font-bold text-white shadow-md shadow-slate-900/20 transition-all duration-200 hover:bg-slate-800 hover:shadow-lg hover:-translate-y-px active:translate-y-0 active:scale-95 dark:bg-white/10 dark:hover:bg-white/15 sm:h-10 sm:px-4"
                    id="github-button">
                    <i class="fa-brands fa-github text-base transition-transform group-hover:scale-110 sm:text-lg"></i>
                    <span class="hidden lg:inline">GitHub</span>
                </a>
            </div>
        </div>

    </div>
</header>
