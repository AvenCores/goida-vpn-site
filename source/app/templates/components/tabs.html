<div class="mb-16"
     x-data='{
        searchQuery: "",
        filterType: "all",
        configs: {{ configs|tojson }},
        init() {
            this.$watch("searchQuery", () => this.triggerAnimation());
            this.$watch("filterType", () => this.triggerAnimation());
        },
        triggerAnimation() {
            // Перезапускаем анимацию только для уже существующих карточек
            const cards = document.querySelectorAll(".animate-card-enter");
            if (cards.length === 0) return;

            cards.forEach((card, i) => {
                card.style.animation = "none";
                card.offsetHeight; // принудительный reflow
                card.style.animation = "";
                card.style.animationDelay = (i * 25) + "ms";
            });
        },
        get filteredConfigs() {
            return this.configs.filter(c => {
                const query = this.searchQuery.toLowerCase();
                const matchesSearch = c.id.toString().includes(query) ||
                                    (c.url && c.url.toLowerCase().includes(query));
                const matchesFilter = this.filterType === "all" ||
                                     (this.filterType === "recommended" && c.is_recommended) ||
                                     (this.filterType === "sni" && c.is_sni);
                return matchesSearch && matchesFilter;
            });
        },
        get activeCount() {
            return this.filteredConfigs.length;
        }
     }'>

    <!-- ════════════════════════════════════════════
         ВКЛАДКИ — сегментированный переключатель
         ════════════════════════════════════════════ -->
    <div class="mb-6 flex items-center justify-center px-0 sm:mb-8">
        <div class="relative grid w-full grid-cols-2 gap-0 rounded-2xl border border-slate-200/80 bg-white/80 p-1.5 shadow-sm backdrop-blur-xl dark:border-white/10 dark:bg-white/5 sm:w-auto sm:min-w-[26rem]" role="tablist" aria-label="Config view">
            <!-- Активный фон (скользящий): геометрия в инлайн-стилях, чтобы не зависеть от сборки Tailwind -->
            <div aria-hidden="true" class="absolute bottom-1.5 top-1.5 rounded-xl bg-slate-900 shadow-md transition-transform duration-300 ease-out dark:bg-white"
                 style="left: 6px; width: calc(50% - 6px); transform: translateX(0);"
                 :style="activeTab === 'configs' ? 'left: 6px; width: calc(50% - 6px); transform: translateX(0);' : 'left: 6px; width: calc(50% - 6px); transform: translateX(100%);'">
            </div>

            <button @click="activeTab = 'configs'; if(window.trackEvent) window.trackEvent('switch_tab', { tab: 'configs' })"
                    role="tab"
                    :aria-selected="(activeTab === 'configs').toString()"
                    :class="activeTab === 'configs' ? 'text-white dark:text-slate-900' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100'"
                    class="relative z-10 flex w-full items-center justify-center gap-2 rounded-xl px-3 py-2.5 text-center text-sm font-extrabold transition-colors duration-200 sm:px-8 sm:py-3 sm:text-[15px]">
                <i class="fa-solid fa-list-ul w-5 shrink-0 text-center text-base leading-none"></i>
                <span class="whitespace-nowrap leading-none" data-i18n="tabs.tab_lists">Списки</span>
                <span class="shrink-0 rounded-md px-1.5 py-0.5 font-mono text-[11px] font-bold leading-none" :class="activeTab === 'configs' ? 'bg-white/20 dark:bg-slate-900/10' : 'bg-slate-100 dark:bg-white/10'" x-text="configs.length"></span>
            </button>
            <button @click="activeTab = 'qr'; if(window.trackEvent) window.trackEvent('switch_tab', { tab: 'qr' })"
                    role="tab"
                    :aria-selected="(activeTab === 'qr').toString()"
                    :class="activeTab === 'qr' ? 'text-white dark:text-slate-900' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100'"
                    class="relative z-10 flex w-full items-center justify-center gap-2 rounded-xl px-3 py-2.5 text-center text-sm font-extrabold transition-colors duration-200 sm:px-8 sm:py-3 sm:text-[15px]">
                <i class="fa-solid fa-qrcode w-5 shrink-0 text-center text-base leading-none"></i>
                <span class="whitespace-nowrap leading-none" data-i18n="tabs.tab_qr">QR-коды</span>
            </button>
        </div>
    </div>

    <!-- ════════════════════════════════════════════
         ПАНЕЛЬ ИНСТРУМЕНТОВ — поиск + фильтры
         ════════════════════════════════════════════ -->
    <div class="mb-6 flex flex-col gap-3 rounded-2xl border border-slate-200/80 bg-white/80 p-3 shadow-sm backdrop-blur-xl transition-all dark:border-white/10 dark:bg-brand-panel/70 sm:p-4 lg:flex-row lg:items-center lg:justify-between">

        <!-- Поиск -->
        <div class="group relative flex-1 lg:max-w-md">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                <i class="fa-solid fa-magnifying-glass text-slate-400 transition-colors group-focus-within:text-brand-blue dark:text-slate-500 dark:group-focus-within:text-blue-400"></i>
            </div>
            <input type="search"
                   id="searchQuery"
                   name="searchQuery"
                   x-model="searchQuery"
                   @input.debounce.500ms="if(window.trackEvent && searchQuery) window.trackEvent('search', { query: searchQuery })"
                   data-i18n-placeholder="tabs.search_placeholder"
                   placeholder="Найти по ID или ссылке..."
                   autocomplete="off"
                   class="block w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-11 text-sm font-medium text-slate-900 outline-none transition-all placeholder:text-slate-400 focus:border-brand-blue focus:bg-white focus:ring-4 focus:ring-brand-blue/15 dark:border-white/10 dark:bg-black/30 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-blue-500 dark:focus:bg-black/40">
            <div class="absolute inset-y-0 right-0 flex items-center gap-2 pr-3">
                <kbd x-show="!searchQuery" class="hidden rounded-md border border-slate-200 bg-white px-1.5 py-0.5 font-mono text-[10px] font-bold text-slate-400 dark:border-white/10 dark:bg-white/5 dark:text-slate-500 sm:block">/</kbd>
                <button x-show="searchQuery"
                        x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 scale-75"
                        x-transition:enter-end="opacity-100 scale-100"
                        @click="searchQuery = ''"
                        aria-label="Clear search"
                        class="rounded-full p-1 text-slate-400 transition hover:bg-slate-200 hover:text-slate-600 dark:hover:bg-white/10 dark:hover:text-slate-200">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Счётчик + Фильтры -->
        <div class="flex flex-col items-stretch gap-2.5 sm:flex-row sm:items-center">
            <!-- Счётчик результатов -->
            <div class="flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 dark:border-white/10 dark:bg-white/5 sm:justify-start">
                <span class="relative flex h-2 w-2">
                    <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-60"></span>
                    <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
                </span>
                <span class="text-xs font-bold tabular-nums text-slate-500 dark:text-slate-400">
                    <span x-text="activeCount"></span>
                    <span data-i18n="tabs.results_label">результатов</span>
                </span>
            </div>

            <!-- Кнопки фильтров -->
            <div class="flex items-center gap-1.5 rounded-xl bg-slate-100/70 p-1 dark:bg-white/5" role="group" aria-label="Filters">
                <button @click="filterType = 'all'; if(window.trackEvent) window.trackEvent('filter', { type: 'all' })"
                        :aria-pressed="(filterType === 'all').toString()"
                        :class="filterType === 'all'
                            ? 'bg-white text-slate-900 shadow-sm dark:bg-white dark:text-slate-900'
                            : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100'"
                        class="flex flex-1 items-center justify-center rounded-lg px-3.5 py-2 text-xs font-extrabold transition-all sm:flex-none" data-i18n="tabs.filter_all">
                    Все
                </button>
                <button @click="filterType = 'recommended'; if(window.trackEvent) window.trackEvent('filter', { type: 'recommended' })"
                        :aria-pressed="(filterType === 'recommended').toString()"
                        :class="filterType === 'recommended'
                            ? 'bg-amber-400 text-amber-950 shadow-sm'
                            : 'text-amber-700 hover:bg-amber-100/60 dark:text-amber-300 dark:hover:bg-amber-500/10'"
                        class="flex flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-lg px-3 py-2 text-xs font-extrabold transition-all sm:flex-none">
                    <i class="fa-solid fa-star text-[10px]"></i>
                    <span class="min-[640px]:hidden">Рек.</span>
                    <span class="hidden min-[640px]:inline" data-i18n="tabs.filter_recommended">Рекомендованные</span>
                </button>
                <button @click="filterType = 'sni'; if(window.trackEvent) window.trackEvent('filter', { type: 'sni' })"
                        :aria-pressed="(filterType === 'sni').toString()"
                        :class="filterType === 'sni'
                            ? 'bg-violet-600 text-white shadow-sm'
                            : 'text-violet-700 hover:bg-violet-100/60 dark:text-violet-300 dark:hover:bg-violet-500/10'"
                        class="flex flex-1 items-center justify-center gap-1.5 whitespace-nowrap rounded-lg px-3 py-2 text-xs font-extrabold transition-all sm:flex-none">
                    <span class="min-[640px]:hidden">SNI/CIDR</span>
                    <span class="hidden min-[640px]:inline" data-i18n="tabs.filter_sni">Обход SNI/CIDR</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ════════════════════════════════════════════
         ВКЛАДКА: СПИСОК КОНФИГОВ
         ════════════════════════════════════════════ -->
    <div x-show="activeTab === 'configs'"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4"
        x-transition:enter-end="opacity-100 translate-y-0">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3 xl:grid-cols-4">
            <template x-for="config in filteredConfigs" :key="config.id">
                <article class="group relative flex flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-slate-300 hover:shadow-xl hover:shadow-slate-900/10 dark:border-white/10 dark:bg-brand-panel dark:hover:border-white/20 dark:hover:shadow-black/40 animate-card-enter"
                     x-data="{ copied: false }">

                    <!-- Заголовок карточки: ID + бейджи -->
                    <div class="flex items-start justify-between gap-3 p-4 pb-3 sm:p-5 sm:pb-3">
                        <div class="flex min-w-0 items-center gap-3">
                            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-500 ring-1 ring-slate-900/5 transition-all duration-300 group-hover:bg-brand-blue group-hover:text-white group-hover:shadow-lg group-hover:shadow-blue-500/25 dark:bg-white/5 dark:text-slate-400 dark:ring-white/10">
                                <i class="fa-solid fa-server text-base"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="truncate text-2xl font-black leading-none tracking-tight text-slate-900 dark:text-white">#<span x-text="config.id"></span></p>
                                <p class="mt-1 truncate font-mono text-[11px] font-semibold text-slate-400 dark:text-slate-500" x-text="(config.url || '').split('://')[0].toUpperCase()"></p>
                            </div>
                        </div>

                        <!-- Бейджи -->
                        <div class="flex max-w-[55%] shrink-0 flex-col items-end gap-1.5">
                            <template x-if="config.is_recommended">
                                <span class="inline-flex shrink-0 items-center gap-1 rounded-lg bg-amber-400 px-2 py-1 text-[10px] font-black uppercase tracking-wide text-amber-950 shadow-sm" :title="t('tabs.badge_recommended', 'Рекомендованный')">
                                    <i class="fa-solid fa-star text-[9px]"></i>
                                    <span x-text="t('tabs.badge_recommended_short', 'Рек.')">Рек.</span>
                                </span>
                            </template>
                            <template x-if="config.is_sni">
                                <span class="inline-flex max-w-full items-center justify-end gap-1 rounded-lg bg-violet-600 px-2 py-1 text-[10px] font-black uppercase tracking-wide text-white shadow-sm" :title="t('tabs.badge_sni', 'Обход SNI/CIDR')">
                                    <i class="fa-solid fa-bolt shrink-0 text-[9px]"></i>
                                    <span class="min-w-0 truncate" data-i18n="tabs.badge_sni">Обход SNI/CIDR</span>
                                </span>
                            </template>
                        </div>
                    </div>

                    <!-- URL конфига -->
                    <div class="px-4 pb-3 sm:px-5">
                        <div class="goida-mono line-clamp-2 flex min-h-[3.4rem] items-center p-3 text-slate-500 transition-colors group-hover:border-brand-blue/30 dark:text-slate-400"
                                 x-text="config.url" :title="config.url">
                        </div>
                    </div>

                    <!-- Футер карточки -->
                    <div class="mt-auto px-4 pb-4 sm:px-5 sm:pb-5">
                        <div class="mb-3 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent dark:via-white/10"></div>

                        <div class="mb-3 flex items-center justify-between gap-2">
                            <!-- Дата обновления -->
                            <template x-if="config.last_update">
                                <div class="flex min-w-0 items-center gap-1.5 text-[10px] font-bold uppercase tracking-wide text-slate-400 dark:text-slate-500">
                                    <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-emerald-500"></span>
                                    <span class="truncate tabular-nums" x-text="config.last_update.datetime_str"></span>
                                </div>
                            </template>
                            <template x-if="!config.last_update">
                                <div></div>
                            </template>

                            <!-- Источники -->
                            <template x-if="config.sources">
                                <div class="flex shrink-0 gap-1">
                                    <template x-if="Array.isArray(config.sources)">
                                        <button @click="showSourcesModal = true; currentSources = config.sources; currentConfigId = config.id"
                                                class="rounded-md px-1 py-0.5 text-[10px] font-extrabold uppercase tracking-widest text-brand-blue transition-colors hover:bg-blue-50 hover:underline dark:text-blue-400 dark:hover:bg-blue-500/10"
                                                data-i18n="tabs.sources">
                                            Источники
                                        </button>
                                    </template>
                                    <template x-if="!Array.isArray(config.sources)">
                                        <a :href="config.sources" target="_blank" rel="noopener noreferrer"
                                           class="rounded-md px-1 py-0.5 text-[10px] font-extrabold uppercase tracking-widest text-brand-blue transition-colors hover:bg-blue-50 hover:underline dark:text-blue-400 dark:hover:bg-blue-500/10"
                                           data-i18n="tabs.source">
                                            Источник
                                        </a>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- Кнопка копирования -->
                        <div class="relative">

                            <button @click="
                                        const url = config.url;
                                        const copy = () => {
                                            copied = true;
                                            if (window.trackEvent) window.trackEvent('copy_config', { config_id: config.id });
                                            setTimeout(() => { copied = false; }, 2000);
                                        };
                                        if (navigator.clipboard && navigator.clipboard.writeText) {
                                            navigator.clipboard.writeText(url).then(copy).catch(() => {
                                                const el = document.createElement('textarea');
                                                el.value = url;
                                                document.body.appendChild(el);
                                                el.select();
                                                document.execCommand('copy');
                                                document.body.removeChild(el);
                                                copy();
                                            });
                                        } else {
                                            const el = document.createElement('textarea');
                                            el.value = url;
                                            document.body.appendChild(el);
                                            el.select();
                                            document.execCommand('copy');
                                            document.body.removeChild(el);
                                            copy();
                                        }
                                    "
                                    class="group/btn relative flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl py-3 text-sm font-extrabold transition-all duration-200 active:scale-[0.97]"
                                    :aria-live="'polite'"
                                    :class="copied
                                        ? 'bg-emerald-600 text-white shadow-md shadow-emerald-500/25'
                                        : 'bg-slate-900 text-white shadow-md shadow-slate-900/15 hover:bg-brand-blue hover:shadow-lg hover:shadow-blue-500/25 dark:bg-blue-600 dark:hover:bg-blue-500'">

                                <i class="fa-solid transition-transform duration-200 group-hover/btn:scale-110"
                                   :class="copied ? 'fa-circle-check' : 'fa-copy'"></i>
                                <span x-text="copied ? t('tabs.copied', 'Скопировано!') : t('tabs.copy_link', 'Копировать ссылку')"></span>
                            </button>
                        </div>
                    </div>
                </article>
            </template>
        </div>

        <!-- Пустое состояние (Списки) -->
        <template x-if="filteredConfigs.length === 0">
            <div class="rounded-2xl border-2 border-dashed border-slate-200 bg-white/70 px-6 py-16 text-center backdrop-blur-xl transition-all dark:border-white/10 dark:bg-brand-panel/60">
                <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-100 text-slate-300 dark:bg-white/5 dark:text-slate-600">
                    <i class="fa-solid fa-magnifying-glass text-2xl"></i>
                </div>
                <h3 class="mb-1.5 text-lg font-black text-slate-900 dark:text-white" data-i18n="tabs.not_found_title_lists">Ничего не найдено</h3>
                <p class="mx-auto mb-6 max-w-sm text-sm text-slate-500 dark:text-slate-400" data-i18n="tabs.not_found_desc_lists">Попробуйте изменить запрос или фильтры</p>
                <button @click="searchQuery = ''; filterType = 'all'"
                        class="goida-btn-primary px-7" data-i18n="tabs.show_all">
                    Показать всё
                </button>
            </div>
        </template>
    </div>

    <!-- ════════════════════════════════════════════
         ВКЛАДКА: QR-КОДЫ
         ════════════════════════════════════════════ -->
    <div x-show="activeTab === 'qr'"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0">

        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
            <template x-for="config in filteredConfigs" :key="config.id">
                <article class="group relative flex flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white text-center shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-slate-900/10 dark:border-white/10 dark:bg-brand-panel dark:hover:shadow-black/40 animate-card-enter"
                     x-data="{ qrHover: false }">

                    <!-- Заголовок -->
                    <div class="flex items-center justify-between gap-2 p-3 pb-2">
                        <div class="flex min-w-0 items-center gap-2">
                            <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-500 ring-1 ring-slate-900/5 transition-all duration-300 group-hover:bg-brand-blue group-hover:text-white dark:bg-white/5 dark:text-slate-400 dark:ring-white/10">
                                <i class="fa-solid fa-server text-[10px]"></i>
                            </div>
                            <span class="truncate text-xl font-black tracking-tight text-slate-900 dark:text-white">#<span x-text="config.id"></span></span>
                        </div>
                        <div class="flex shrink-0 flex-col items-end gap-1">
                            <template x-if="config.is_recommended">
                                <span class="inline-flex items-center gap-1 rounded-md bg-amber-400 px-1.5 py-0.5 text-[9px] font-black uppercase tracking-wide text-amber-950">
                                    <i class="fa-solid fa-star text-[8px]"></i>
                                    <span x-text="t('tabs.badge_recommended_short', 'Рек.')">Рек.</span>
                                </span>
                            </template>
                            <template x-if="config.is_sni">
                                <span class="inline-flex items-center gap-1 rounded-md bg-violet-600 px-1.5 py-0.5 text-[9px] font-black uppercase tracking-wide text-white">
                                    <i class="fa-solid fa-bolt text-[8px]"></i>
                                    SNI
                                </span>
                            </template>
                        </div>
                    </div>

                    <!-- QR-код -->
                    <div class="group/qr relative mx-3 mb-3 overflow-hidden rounded-xl border border-slate-100 bg-white p-1.5 dark:border-white/10 dark:bg-black/30"
                         @mouseenter="qrHover = true"
                         @mouseleave="qrHover = false">

                        <img :src="'static/qr-codes/' + config.id + '.png'"
                             :alt="'QR код конфига ' + config.id"
                             loading="lazy"
                             class="aspect-square w-full rounded-lg transition-all duration-300"
                             :class="qrHover ? 'scale-[1.04] brightness-[0.72] dark:brightness-50' : ''">

                        <!-- Оверлей при наведении -->
                        <div class="absolute inset-1.5 flex items-center justify-center rounded-lg transition-all duration-200"
                             :class="qrHover ? 'bg-slate-900/45 opacity-100 backdrop-blur-[2px] dark:bg-black/55' : 'pointer-events-none opacity-0'">
                            <button @click="currentQrConfigId = config.id; showQrOpenModal = true"
                                    class="flex items-center gap-1.5 rounded-xl bg-white px-4 py-2.5 text-xs font-extrabold text-slate-900 shadow-xl transition-all duration-200 hover:scale-105 active:scale-95 dark:bg-white dark:text-slate-900">
                                <i class="fa-solid fa-eye"></i>
                                <span>Открыть</span>
                            </button>
                        </div>
                    </div>

                    <!-- Футер -->
                    <div class="mt-auto px-3 pb-3">
                        <div class="mb-2.5 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent dark:via-white/10"></div>

                        <div class="mb-2.5 flex min-h-[1rem] flex-col items-center gap-1">
                            <template x-if="config.last_update">
                                <div class="flex items-center gap-1 text-[9px] font-bold uppercase tracking-tight text-slate-400 tabular-nums dark:text-slate-500">
                                    <span class="h-1 w-1 rounded-full bg-emerald-500"></span>
                                    <span x-text="config.last_update.datetime_str"></span>
                                </div>
                            </template>
                        </div>

                        <button @click="$dispatch('open-qr-download-modal', { configId: config.id })"
                                class="group/qr-btn flex w-full items-center justify-center gap-2 rounded-xl bg-slate-900 py-2.5 text-xs font-extrabold text-white transition-all duration-200 hover:bg-brand-blue active:scale-[0.97] dark:bg-blue-600 dark:hover:bg-blue-500">
                            <i class="fa-solid fa-download transition-transform duration-200 group-hover/qr-btn:scale-110"></i>
                            <span data-i18n="tabs.download">Скачать</span>
                        </button>
                    </div>
                </article>
            </template>
        </div>

        <!-- Пустое состояние (QR) -->
        <template x-if="filteredConfigs.length === 0">
            <div class="rounded-2xl border-2 border-dashed border-slate-200 bg-white/70 px-6 py-16 text-center backdrop-blur-xl dark:border-white/10 dark:bg-brand-panel/60">
                <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-100 text-slate-300 dark:bg-white/5 dark:text-slate-600">
                    <i class="fa-solid fa-qrcode text-2xl"></i>
                </div>
